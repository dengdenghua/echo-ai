# Commit-time checks, run by .husky/pre-commit as
#   pre-commit run --hook-stage pre-commit --files <the commit's files>
# Passing --files keeps pre-commit from stashing unstaged changes: this
# checkout is shared by concurrent sessions, and a stash would revert their
# uncommitted files for the length of the run. The whole-tree ratchets run
# in `tree-gates`, against a snapshot of the exact tree being committed.
#
# Install once: `uv tool install pre-commit` (husky finds it on PATH and puts
# .venv on PATH, so `python`, `ruff` and `bandit` below are the locked ones).
# The commit-msg hook (.husky/commit-msg) runs commitlint; .husky/pre-push
# runs tools/hooks/commit_tree_gates.py --push with the slower scans.
default_stages: [pre-commit]
# Generated or vendored: regenerate them instead of fixing them by hand.
exclude: ^(docs/auto/|docs/openapi-snapshot\.json$|frontend/src/core/api/openapi-types\.ts$|extensions/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses !!python tags; check syntax only.
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
        exclude: /templates/.*tsconfig\..*\.json$
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      # Same scope and locked version as CI's `ruff check` / `ruff format --check`.
      - id: ruff
        name: ruff check
        entry: ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^(runtime|tests|tools)/

      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^(runtime|tests|tools)/

      # CI: bandit -r runtime/ -ll -ii (zero MEDIUM+ findings).
      - id: bandit
        name: bandit
        entry: bandit -ll -ii -q
        language: system
        types: [python]
        files: ^runtime/

      - id: invariant-lint
        name: echo-ai invariant lint
        entry: python -m tools.lint.invariant_check
        language: system
        types: [python]
        files: ^(runtime/|tests/)
        exclude: ^(tools/lint/fixtures/)

      - id: skill-dedup
        name: no duplicate skill packages
        entry: python tools/lint/skill_dedup_check.py --strict
        language: system
        pass_filenames: false
        # Run only when SKILL.md or skill scripts change. Cheap on
        # other commits; ~1s when it does run.
        files: ^runtime/execution/all_skills/

      - id: root-hygiene
        name: repository root matches ROOT_LAYOUT.md allow-list
        entry: python tools/lint/root_hygiene.py --strict
        language: system
        pass_filenames: false
        # Block any commit that adds a top-level file or directory not
        # enumerated in ROOT_ALLOWLIST (mirrors ROOT_LAYOUT.md).
        files: ^(?!\.gitignore$|ROOT_LAYOUT\.md$|tools/lint/root_hygiene\.py$).*

      # The CI ratchets that drifted most (exception audit, god files,
      # function length, inline locale, kernel source pins, docs/auto, the
      # frontend type-assertion ratchet, the OpenAPI snapshot), each only
      # when its inputs changed, in parallel, on the committed tree: about
      # 25 s when docs/auto is involved, a few seconds otherwise.
      # .husky/pre-commit runs it after pre-commit rather than through it,
      # because pre-commit fails a hook when any tracked file changes while
      # it runs, and other sessions keep editing this tree. Manual run:
      #   pre-commit run --hook-stage manual tree-gates
      - id: tree-gates
        name: CI ratchets on the committed tree
        entry: python tools/hooks/commit_tree_gates.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
