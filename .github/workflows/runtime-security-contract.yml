name: Runtime security contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-security-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-security-contract:
    name: Runtime security contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.25"
      - name: Install this checkout's locked test environment
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --python 3.11.9 --extra dev --extra serve
      - name: Verify gate integrity and deliberate regression rejection
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --no-sync python -B -m pytest -q -p no:cacheprovider -o addopts= tests/test_security_contract_gate.py
      - name: Verify runtime behavior against the reviewed contract
        if: always()
        run: uv run --no-sync python -B tools/security_contract.py --repo . --output artifacts/runtime-security-contract.json
      - name: Verify scoped kernel release and durable device-task recovery
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          uv run --no-sync python -B -m pytest
          tests/test_kernel_release.py tests/test_device_task_live_socket.py
          tests/test_task_workspace.py tests/test_task_workspace_transport.py
          tests/test_transfer_recovery.py tests/test_tentacle_procedure.py
          --runxfail -q --timeout=60 -p no:cacheprovider
      - name: Verify reviewed kernel source revision
        if: always()
        run: uv run --no-sync python -B tools/kernel_release.py --repo . --output artifacts/kernel-release.json
      - name: Upload structured contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-security-contract-${{ matrix.os }}
          path: |
            artifacts/runtime-security-contract.json
            artifacts/kernel-release.json
          if-no-files-found: error
