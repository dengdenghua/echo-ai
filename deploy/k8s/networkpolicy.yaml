apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: echo-ai-ingress
  namespace: echo-ai
spec:
  podSelector:
    matchLabels:
      app: echo-ai
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Fail closed until the operator explicitly labels the namespace that
        # owns the chosen ingress controller; see deploy/k8s/README.md.
        - namespaceSelector:
            matchLabels:
              echo-ai.io/ingress-access: "true"
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: echo-ai
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: echo-ai
      ports:
        - protocol: TCP
          port: 6379
