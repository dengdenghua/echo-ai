appId: ai.echo.desktop
productName: Echo
copyright: Echo · EchoOS
compression: maximum
directories:
  output: ../.workbuddy/release
  buildResources: ../packaging/desktop
files:
- dist/**/*
- electron/**/*
- '!electron/**/*.test.mjs'
- '!node_modules/**/*'
- '!**/*.map'
extraResources:
- from: ../extensions/echo-browser-relay
  to: extensions/echo-browser-relay
  filter:
  - '**/*'
- from: ../extensions/workbuddy-connectors
  to: extensions/workbuddy-connectors
  filter:
  - '**/*'
- from: ../packaging/desktop/config.desktop.yaml
  to: config.desktop.yaml
- from: ../agents
  to: agents
  filter:
  - '**/*'
  - '!**/sessions/**'
  - '!**/workspace/**'
  - '!**/*.jsonl'
  - '!**/*.lock'
  - '!**/*.bak'
  - '!**/visuals/backups/**'
  - '!**/visuals/source_turnaround.*'
  - '!**/visuals/source-turnaround.*'
  - '!**/visuals/source_portrait.*'
  - '!**/visuals/source-portrait.*'
  - '!**/visuals/originals/**'
  - '!**/visuals/*-before-padding.*'
  - '!**/visuals/*-restored-256-upscaled.*'
  - '!**/agent-core/.soul_history/**'
- from: ../prompts
  to: prompts
- from: ../protocols
  to: protocols
- from: ../skills.lock.json
  to: skills.lock.json
mac:
  target:
  - dmg
  category: public.app-category.developer-tools
  extraResources:
  - from: ../extras/desktop/build/backend/echo-backend
    to: backend/echo-backend
  - from: ../extras/desktop/build/codex
    to: codex
    filter:
    - '**/*'
  - from: ../extras/desktop/build/opencode
    to: opencode
    filter:
    - '**/*'
win:
  target:
  - nsis
  forceCodeSigning: false
  signExts:
  - .exe
  artifactName: ${productName}-Setup-${version}-local.${ext}
  extraResources:
  - from: ../extras/desktop/build/backend/echo-backend.exe
    to: backend/echo-backend.exe
  - from: ../extras/desktop/build/codex
    to: codex
    filter:
    - '**/*'
  - from: ../extras/desktop/build/opencode
    to: opencode
    filter:
    - '**/*'
linux:
  target:
  - AppImage
  category: Development
  artifactName: ${productName}-Setup-Linux-${version}-${env.GITHUB_SHA}.${ext}
  extraResources:
  - from: ../extras/desktop/build/backend/echo-backend
    to: backend/echo-backend
  - from: ../extras/desktop/build/codex
    to: codex
    filter:
    - '**/*'
  - from: ../extras/desktop/build/opencode
    to: opencode
    filter:
    - '**/*'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
