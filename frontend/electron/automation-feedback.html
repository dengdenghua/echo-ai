<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'">
<title>Echo AI 操作提示</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:320px;height:112px;background:transparent;overflow:hidden;pointer-events:none;user-select:none}
#halo{position:absolute;left:141px;top:37px;width:38px;height:38px;border:2px solid #48e5ed;border-radius:50%;box-shadow:0 0 0 5px #8b5cf62b,0 0 14px #37dbe877;animation:breathe 1.2s ease-in-out infinite}
#halo:after{content:"";position:absolute;inset:-5px;border:2px solid transparent;border-top-color:#a58aff;border-right-color:#a58aff;border-radius:50%;transform:rotate(20deg)}
#badge{position:absolute;left:168px;top:65px;background:#6155d9;color:#fff;border:1px solid #e4dcff;border-radius:6px;font:700 9px/15px system-ui;padding:0 3px}
#label{position:absolute;left:188px;top:43px;max-width:128px;white-space:nowrap;padding:6px 10px;border-radius:9px;background:#192238ed;border:1px solid #b7e7f440;color:#f6fcff;font:600 12px/18px system-ui,"Microsoft YaHei";box-shadow:0 2px 10px #0003}
body[data-side=left] #label{left:auto;right:188px}body[data-phase=error] #halo{border-color:#f5b454}body[data-phase=done] #halo{animation:none;opacity:.8}
#ripple{position:absolute;left:141px;top:37px;width:38px;height:38px;border:2px solid #73f5fc;border-radius:50%;opacity:0}
#ripple.pulse{animation:click .85s ease-out}
@keyframes click{0%{opacity:1;transform:scale(.75)}100%{opacity:0;transform:scale(2.5)}}
@keyframes breathe{50%{box-shadow:0 0 0 7px #8b5cf61a,0 0 18px #37dbe899}}
@media(prefers-reduced-motion:reduce){#halo,#ripple.pulse{animation:none}#ripple.pulse{opacity:.5}}
</style><body><div id="halo"></div><div id="ripple"></div><span id="badge">AI</span><span id="label">AI · 正在操作</span></body></html>
