<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECHO AI</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="theme-color"
      content="#090a0c"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#eef0f3"
      media="(prefers-color-scheme: light)"
    />
    <!-- Inter is self-hosted via @fontsource/inter (imported in src/main.tsx);
         no external font CDN is required at runtime. -->
    <style>
      /* ECHO splash: Graphite ground, snow mark, one cyan core that breathes.
         Values are the ECHO tokens (echo-tokens.css), inlined because this
         paints before any stylesheet loads. */
      :root {
        --startup-background: #090a0c;
        --startup-mark: #eef1f4;
        --startup-core: #6fe3f0;
        --startup-label: #9aa3ae;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --startup-background: #eef0f3;
          --startup-mark: #111317;
          --startup-core: #08788a;
          --startup-label: #59616c;
        }
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      /* Splash-only paint: applies before the theme provider puts .light/.dark
         on <html>. Once booted, the app theme (--background) must win,
         otherwise an OS "light" preference pins html/body to white even in
         dark mode. */
      html:not(.light):not(.dark),
      html:not(.light):not(.dark) body {
        background: var(--startup-background);
      }

      body {
        outline: none;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      .startup-loader {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background: var(--startup-background);
      }

      .startup-loader__logo {
        display: block;
        width: 64px;
        height: 64px;
        color: var(--startup-mark);
        opacity: 0;
        animation: echo-splash-fade-in 200ms cubic-bezier(0.2, 0.8, 0.2, 1) 60ms
          forwards;
      }

      .startup-loader__core {
        fill: var(--startup-core);
        animation: echo-core-breathe 2.4s ease-in-out infinite;
      }

      .startup-loader__label {
        position: absolute;
        bottom: 32%;
        left: 50%;
        transform: translateX(-50%);
        font-family:
          "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        line-height: 16px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--startup-label);
        opacity: 0;
        animation: echo-label-fade-in 320ms cubic-bezier(0.2, 0.8, 0.2, 1) 320ms
          forwards;
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-loader__logo,
        .startup-loader__label {
          animation: none;
          opacity: 1;
        }
        .startup-loader__core {
          animation: none;
        }
      }

      @keyframes echo-splash-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes echo-label-fade-in {
        from {
          opacity: 0;
          transform: translate(-50%, 4px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }

      /* Echo Core breathe: 2.4s, 70%–100% brightness (ECHO motion rule). */
      @keyframes echo-core-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-loader" aria-hidden="true">
        <svg
          class="startup-loader__logo"
          viewBox="0 0 64 64"
          width="64"
          height="64"
          fill="none"
        >
          <path
            d="M50 17H24a7 7 0 0 0-7 7v16a7 7 0 0 0 7 7h26"
            stroke="currentColor"
            stroke-width="6"
          />
          <circle class="startup-loader__core" cx="38" cy="32" r="5" />
        </svg>
        <div class="startup-loader__label">ECHO · AI</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
